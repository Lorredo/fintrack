services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack-db
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_DB: fintrack
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: fintrack-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://fintrack:fintrack@postgres:5432/fintrack?sslmode=disable"
      JWT_SECRET: "change-me-in-production"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "168h"
      MIGRATIONS_PATH: "/app/migrations"
    volumes:
      - ./database/migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: